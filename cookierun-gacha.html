<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>쿠키 뽑기 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
/*
  쿠키런: 킹덤 팬메이드 쿠키 뽑기 시뮬레이터
  - 쿠키 이름/등급/뽑기 구조는 공식 게임·위키 정보를 참고
  - 이미지·사운드는 저작권 문제로 SVG·Web Audio로 직접 제작 (CONFIG.USE_LOCAL_ASSETS 로 교체 가능)
*/
:root {
  --sky-top: #6ec6ff;
  --sky-bottom: #fff3c4;
  --wood: #8a4b22;
  --wood-dark: #5b2d10;
  --cream: #fff7e0;
  --gold: #ffcf3f;
  --gold-dark: #d9901a;
  --text: #4a2511;
  --btn-green: #6fd13a;
  --btn-green-dark: #3f9a18;
  --btn-orange: #ffae2b;
  --btn-orange-dark: #d8770b;

  --r-common: #b9a58d;
  --r-rare: #4fb0ff;
  --r-epic: #d45cff;
  --r-superepic: #ff4f6d;
  --r-legendary: #3ff0d0;
  --r-dragon: #ff3b1f;
  --r-ancient: #fff1a8;
  --r-beast: #8b2cff;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Jua', 'Do Hyeon', system-ui, sans-serif;
  color: var(--text);
  background: #2a1406;
  user-select: none;
}
#game {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100%;
  margin: 0 auto;
  overflow: hidden;
  background: linear-gradient(var(--sky-top), var(--sky-bottom));
}
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  opacity: 0; pointer-events: none;
  transition: opacity .5s ease;
}
.screen.active { opacity: 1; pointer-events: auto; }

/* ---------- 공용 버튼 ---------- */
.btn {
  font-family: inherit;
  font-size: 20px;
  color: #fff;
  border: 3px solid #4a2511;
  border-radius: 18px;
  padding: 12px 22px;
  cursor: pointer;
  text-shadow: 0 2px 0 rgba(0,0,0,.35);
  box-shadow: 0 5px 0 #4a2511;
  transition: transform .08s, box-shadow .08s;
  background: linear-gradient(#8ff05a, var(--btn-green) 50%, var(--btn-green-dark));
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #4a2511; }
.btn.orange { background: linear-gradient(#ffd070, var(--btn-orange) 50%, var(--btn-orange-dark)); }
.btn.brown  { background: linear-gradient(#b8764a, var(--wood) 50%, var(--wood-dark)); }
.btn.small  { font-size: 15px; padding: 7px 12px; border-radius: 12px; box-shadow: 0 3px 0 #4a2511; }
.btn:disabled { filter: grayscale(.9) brightness(.8); cursor: not-allowed; }

.icon-btn {
  position: absolute; top: 12px;
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 3px solid #4a2511;
  background: var(--cream);
  font-size: 20px;
  cursor: pointer;
  z-index: 50;
  box-shadow: 0 3px 0 #4a2511;
}

/* ---------- 상단 재화 바 ---------- */
.topbar {
  width: 100%;
  display: flex; justify-content: flex-end; align-items: center; gap: 8px;
  padding: 12px 64px 0 12px;
  z-index: 5;
}
.currency {
  display: flex; align-items: center; gap: 6px;
  background: rgba(40,20,5,.75);
  color: #fff;
  border-radius: 20px;
  padding: 4px 12px 4px 6px;
  font-size: 17px;
  border: 2px solid #ffe7a3;
}
.currency .plus {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--btn-green); border: 2px solid #fff;
  color: #fff; font-size: 14px; line-height: 16px; text-align: center;
  cursor: pointer; margin-left: 4px;
}

/* ---------- 타이틀 화면 ---------- */
#title { justify-content: flex-end; padding-bottom: 60px; }
#title .bg-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.logo {
  position: absolute; top: 10%;
  text-align: center;
  animation: bob 3s ease-in-out infinite;
}
.logo .l1 {
  font-family: 'Do Hyeon', sans-serif;
  font-size: 30px; color: #fff;
  -webkit-text-stroke: 2px #6b3408;
  letter-spacing: 1px;
}
.logo .l2 {
  font-size: 58px; line-height: 1;
  color: var(--gold);
  -webkit-text-stroke: 3px #6b3408;
  text-shadow: 0 6px 0 #6b3408, 0 10px 18px rgba(0,0,0,.35);
}
.logo .l3 {
  margin-top: 10px;
  display: inline-block;
  background: #fff; border: 3px solid #6b3408; border-radius: 30px;
  padding: 4px 18px; font-size: 20px;
}
@keyframes bob { 50% { transform: translateY(-8px); } }
#title .start-btn { font-size: 26px; padding: 16px 38px; z-index: 2; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
#title .notice { margin-top: 14px; font-size: 13px; color: #6b3408; z-index: 2; opacity: .8; text-align: center; padding: 0 20px; }

/* ---------- 환영 전환 ---------- */
#welcome { justify-content: center; background: radial-gradient(circle, #fff6c9 0%, #ffcf5a 55%, #e0791c 100%); }
#welcome .rays {
  position: absolute; width: 200%; height: 200%; left: -50%; top: -50%;
  background: repeating-conic-gradient(rgba(255,255,255,.35) 0 10deg, transparent 10deg 20deg);
  animation: spin 12s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#welcome .gnome { width: 170px; z-index: 2; transform: scale(0); }
#welcome.active .gnome { animation: popIn .6s .2s cubic-bezier(.3,1.6,.5,1) forwards; }
.speech {
  z-index: 2;
  margin-top: 12px;
  background: #fff; border: 4px solid #6b3408; border-radius: 22px;
  padding: 16px 24px; font-size: 26px; text-align: center;
  position: relative; transform: scale(0);
}
.speech::before {
  content: ''; position: absolute; top: -18px; left: 50%; margin-left: -12px;
  border: 12px solid transparent; border-bottom: 14px solid #6b3408; border-top: 0;
}
#welcome.active .speech { animation: popIn .5s .7s cubic-bezier(.3,1.6,.5,1) forwards; }
.speech b { color: #e0561c; }
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
.confetti { position: absolute; top: -20px; width: 10px; height: 16px; z-index: 3; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------- 뽑기 화면 ---------- */
#gacha { background: linear-gradient(#3b1d0c, #6b3a1a 45%, #9b5a2a); }
#gacha .wall {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 38px, rgba(0,0,0,.18) 38px 41px),
    repeating-linear-gradient(90deg, transparent 0 78px, rgba(0,0,0,.12) 78px 81px);
  opacity: .6;
}
.banner {
  margin-top: 8px; z-index: 2;
  width: 92%;
  background: linear-gradient(135deg, #ffe38a, #ffb347);
  border: 4px solid #6b3408; border-radius: 18px;
  padding: 8px 12px; text-align: center;
  box-shadow: 0 5px 0 #4a2511;
}
.banner h2 { font-size: 24px; color: #6b3408; }
.banner p { font-size: 14px; color: #8a4b22; }
.oven-wrap { position: relative; z-index: 2; margin-top: 10px; width: 300px; height: 320px; }
.oven-wrap svg { width: 100%; height: 100%; overflow: visible; }
.oven-wrap.shake { animation: shake .12s linear infinite; }
@keyframes shake {
  0% { transform: translate(0,0) rotate(0); }
  25% { transform: translate(-3px,1px) rotate(-1deg); }
  50% { transform: translate(2px,-2px) rotate(1deg); }
  75% { transform: translate(-1px,2px) rotate(0); }
}
#ovenGlow { transition: fill .3s, opacity .3s; }
#ovenDoor { transform-origin: 150px 256px; transition: transform .45s cubic-bezier(.4,1.6,.6,1); }
#ovenDoor.open { transform: scaleY(-0.25) translateY(40px); }
.steam { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.7); filter: blur(4px); animation: steam 1.5s ease-out forwards; z-index: 3; }
@keyframes steam { to { transform: translateY(-120px) scale(2.5); opacity: 0; } }

.pull-row { z-index: 2; display: flex; gap: 14px; margin-top: 6px; }
.pull-btn { display: flex; flex-direction: column; align-items: center; min-width: 140px; }
.pull-btn .cost { font-size: 14px; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.info-row { z-index: 2; margin-top: 14px; display: flex; gap: 10px; align-items: center; color: #ffe7a3; font-size: 15px; }
.pity { background: rgba(0,0,0,.35); border-radius: 12px; padding: 4px 10px; }

/* ---------- 연출 오버레이 ---------- */
#reveal {
  position: absolute; inset: 0; z-index: 55;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(20,8,2,.8);
}
#reveal.show { display: flex; }
#reveal .flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
#reveal .flash.go { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
#reveal .burst {
  position: absolute; width: 640px; height: 640px; left: 50%; top: 50%; margin: -340px 0 0 -320px;
  background: repeating-conic-gradient(var(--burst, #fff) 0 8deg, transparent 8deg 20deg);
  opacity: .35; border-radius: 50%;
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%);
          mask: radial-gradient(circle, #000 20%, transparent 68%);
  animation: spin 10s linear infinite;
}
.counter { position: absolute; top: 18px; left: 18px; color: #fff; font-size: 20px; z-index: 3; }
.skip-btn { position: absolute; top: 14px; right: 14px; z-index: 3; }
.tap-hint { position: absolute; bottom: 28px; color: #fff; font-size: 18px; opacity: .8; animation: blink 1.2s infinite; z-index: 3; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- 카드 ---------- */
.card {
  --rc: var(--r-common);
  position: relative;
  width: 240px; height: 340px;
  perspective: 1000px;
  z-index: 3;
}
.card .inner {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.3,1.3,.5,1);
}
.card.flipped .inner { transform: rotateY(180deg); }
.card .face {
  position: absolute; inset: 0; border-radius: 20px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 5px solid #4a2511;
  overflow: hidden;
}
.card .back {
  background:
    radial-gradient(circle at 50% 45%, rgba(255,255,255,.4), transparent 50%),
    repeating-linear-gradient(45deg, #b7682b 0 14px, #a45a22 14px 28px);
  display: flex; align-items: center; justify-content: center;
}
.card .back .emblem {
  width: 110px; height: 110px; border-radius: 50%;
  background: #ffe7a3; border: 5px solid #6b3408;
  display: flex; align-items: center; justify-content: center; font-size: 56px;
}
.card .front {
  transform: rotateY(180deg);
  background: linear-gradient(170deg, #fffaf0 0%, #ffe9c2 100%);
  display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 0 0 4px var(--rc), 0 0 40px var(--rc);
}
.card .front .art {
  width: 100%; height: 62%;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--rc) 55%, #fff) 0%, color-mix(in srgb, var(--rc) 25%, #fff5e0) 70%);
  border-bottom: 4px solid #4a2511;
  position: relative;
}
.card .front .art svg, .card .front .art img { height: 88%; max-width: 90%; object-fit: contain; }
.rarity-badge {
  margin-top: -16px; z-index: 2;
  padding: 3px 14px; border-radius: 14px;
  border: 3px solid #4a2511;
  font-size: 16px; color: #fff;
  text-shadow: 0 1px 0 rgba(0,0,0,.5);
  background: var(--rc);
}
.rarity-legendary .rarity-badge { background: linear-gradient(90deg,#ff7b7b,#ffd66b,#7bffb0,#6bc8ff,#c77bff); }
.rarity-ancient .rarity-badge { background: linear-gradient(90deg,#fff6c9,#ffd76b,#fff6c9); color: #7a4b00; text-shadow: none; }
.rarity-beast .rarity-badge { background: linear-gradient(90deg,#3a0066,#8b2cff,#ff2c6a); }
.rarity-dragon .rarity-badge { background: linear-gradient(90deg,#ff3b1f,#ffae00); }
.card .name { margin-top: 8px; font-size: 22px; text-align: center; padding: 0 8px; line-height: 1.15; }
.card .kind { margin-top: 4px; font-size: 15px; color: #8a4b22; }
.card .tag {
  position: absolute; top: 10px; left: 10px;
  background: #ff3d3d; color: #fff; font-size: 14px;
  border: 2px solid #fff; border-radius: 10px; padding: 1px 8px;
  transform: rotate(-10deg);
  z-index: 3;
}
.card .tag.dup { background: #7d6b5a; }
.card .ss-count {
  position: absolute; bottom: 8px; right: 10px;
  font-size: 22px; color: #fff; -webkit-text-stroke: 1px #4a2511;
  text-shadow: 0 2px 0 #4a2511;
}
.card.pop { animation: cardPop .55s cubic-bezier(.3,1.5,.5,1); }
@keyframes cardPop { from { transform: translateY(120px) scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
.card.hi .front::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.75) 45%, transparent 60%);
  background-size: 250% 100%;
  animation: shine 2.2s ease-in-out infinite;
}
@keyframes shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }

/* ---------- 결과 화면 ---------- */
#result { background: linear-gradient(#4a2511, #7a4320); }
#result h2 { color: var(--gold); font-size: 30px; margin-top: 18px; text-shadow: 0 3px 0 #2a1406, 0 0 14px rgba(255,207,63,.5); }
#result .summary { color: #ffe7a3; font-size: 15px; margin: 4px 0 8px; text-align: center; padding: 0 12px; }
.grid {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px;
  width: 100%; padding: 8px 12px; overflow-y: auto; flex: 1;
  align-content: start;
}
.grid.single { grid-template-columns: 1fr; justify-items: center; }
.mini {
  --rc: var(--r-common);
  position: relative;
  aspect-ratio: 3/4.2;
  border-radius: 10px; border: 3px solid #4a2511;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 50%, #fff) 0%, color-mix(in srgb, var(--rc) 20%, #fff3dc) 75%);
  box-shadow: 0 0 0 2px var(--rc);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 4px 2px;
  cursor: pointer;
  animation: cardPop .4s both cubic-bezier(.3,1.5,.5,1);
  transition: transform .1s;
}
.mini:hover { transform: translateY(-3px); }
.grid.single .mini { width: 150px; }
.mini svg, .mini img { width: 90%; flex: 1; min-height: 0; }
.mini .mr { font-size: 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; color: #fff; background: var(--rc); border-radius: 6px; padding: 0 4px; border: 1px solid #4a2511; white-space: nowrap; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.mini .mn { font-size: 11px; text-align: center; line-height: 1.05; margin-top: 2px; word-break: keep-all; }
.mini .ms { position: absolute; top: 2px; right: 4px; font-size: 13px; color: #fff; -webkit-text-stroke: .6px #4a2511; }
.mini .mnew { position: absolute; top: -4px; left: -4px; background: #ff3d3d; color: #fff; font-size: 10px; border-radius: 6px; padding: 0 4px; border: 1px solid #fff; }
.result-actions { display: flex; gap: 10px; padding: 12px 12px 22px; flex-wrap: wrap; justify-content: center; }

/* ---------- 카드 뷰어 / 모달 ---------- */
.modal {
  position: absolute; inset: 0; z-index: 60;
  background: rgba(10,4,0,.82);
  display: none; flex-direction: column; align-items: center; justify-content: center;
}
.modal.show { display: flex; }
.viewer-nav { display: flex; align-items: center; gap: 14px; }
.nav-arrow {
  width: 48px; height: 48px; border-radius: 50%;
  border: 3px solid #4a2511; background: var(--gold);
  font-size: 24px; color: #4a2511; cursor: pointer;
  box-shadow: 0 3px 0 #4a2511;
  font-family: inherit;
}
.nav-arrow:disabled { opacity: .35; cursor: default; }
.viewer-count { color: #fff; font-size: 18px; margin-top: 14px; }
.viewer-desc { color: #ffe7a3; font-size: 15px; margin-top: 6px; text-align: center; padding: 0 30px; max-width: 420px; }
.close-x { position: absolute; top: 14px; right: 14px; }

.panel {
  background: var(--cream); border: 4px solid #4a2511; border-radius: 18px;
  width: 90%; max-height: 80%; overflow-y: auto; padding: 16px;
}
.panel h3 { font-size: 22px; text-align: center; margin-bottom: 8px; }
.panel table { width: 100%; border-collapse: collapse; font-size: 14px; }
.panel th, .panel td { border-bottom: 1px dashed #c9a57a; padding: 5px 4px; text-align: center; }
.panel td:first-child { text-align: left; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #4a2511; margin-right: 6px; vertical-align: -1px; }
.panel .note { font-size: 12px; color: #8a4b22; margin-top: 10px; line-height: 1.5; }
.panel .cookies-list { font-size: 13px; line-height: 1.5; margin-top: 8px; }
.panel .cookies-list b { display: inline-block; min-width: 64px; }

.toast {
  position: absolute; left: 50%; top: 70px; transform: translateX(-50%);
  background: rgba(40,20,5,.9); color: #fff; padding: 8px 16px; border-radius: 14px;
  z-index: 100; font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

@media (max-height: 700px) {
  .oven-wrap { width: 250px; height: 265px; }
  .card { width: 210px; height: 300px; }
  .logo .l2 { font-size: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>
<div id="game">

  <button class="icon-btn" id="soundBtn" style="right:12px" title="사운드 켜기/끄기">🔊</button>

  <!-- ================= 1. 타이틀 ================= -->
  <section class="screen active" id="title">
    <svg class="bg-svg" viewBox="0 0 480 860" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="castleG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff9ec"/><stop offset="1" stop-color="#f3d7a6"/>
        </linearGradient>
        <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff7aa8"/><stop offset="1" stop-color="#e0457d"/>
        </linearGradient>
      </defs>
      <!-- 구름 -->
      <g fill="#fff" opacity=".9">
        <ellipse cx="80" cy="140" rx="60" ry="22"/><ellipse cx="115" cy="125" rx="40" ry="24"/>
        <ellipse cx="390" cy="220" rx="70" ry="22"/><ellipse cx="360" cy="205" rx="40" ry="22"/>
      </g>
      <!-- 언덕 -->
      <path d="M0 640 Q120 560 240 610 T480 590 V860 H0Z" fill="#8fd96b"/>
      <path d="M0 700 Q140 640 260 690 T480 670 V860 H0Z" fill="#6cc24a"/>
      <!-- 쿠키 성 -->
      <g transform="translate(240 600)">
        <rect x="-110" y="-150" width="220" height="150" fill="url(#castleG)" stroke="#8a4b22" stroke-width="4"/>
        <rect x="-150" y="-200" width="60" height="200" fill="url(#castleG)" stroke="#8a4b22" stroke-width="4"/>
        <rect x="90" y="-200" width="60" height="200" fill="url(#castleG)" stroke="#8a4b22" stroke-width="4"/>
        <rect x="-40" y="-260" width="80" height="120" fill="url(#castleG)" stroke="#8a4b22" stroke-width="4"/>
        <path d="M-160 -200 L-120 -270 L-80 -200Z" fill="url(#roofG)" stroke="#8a4b22" stroke-width="4"/>
        <path d="M80 -200 L120 -270 L160 -200Z" fill="url(#roofG)" stroke="#8a4b22" stroke-width="4"/>
        <path d="M-52 -260 L0 -350 L52 -260Z" fill="url(#roofG)" stroke="#8a4b22" stroke-width="4"/>
        <path d="M0 -350 v-30 l24 8 -24 8" fill="#ffcf3f" stroke="#8a4b22" stroke-width="3"/>
        <path d="M-30 0 v-60 a30 30 0 0 1 60 0 v60Z" fill="#8a4b22"/>
        <circle cx="0" cy="-200" r="16" fill="#ffcf3f" stroke="#8a4b22" stroke-width="3"/>
        <circle cx="-120" cy="-140" r="10" fill="#6ec6ff" stroke="#8a4b22" stroke-width="3"/>
        <circle cx="120" cy="-140" r="10" fill="#6ec6ff" stroke="#8a4b22" stroke-width="3"/>
        <!-- 아이싱 -->
        <path d="M-110 -150 q13 14 27 0 q14 14 27 0 q14 14 28 0 q13 14 28 0 q14 14 27 0 q14 14 27 0 q14 14 28 0 q13 14 28 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

/* =========================================================
   사운드 (Web Audio 합성 — 외부 음원 없이 동작)
   ========================================================= */
const Sound = (() => {
  let ctx, master, bgmTimer, bgmOn = false, bgmAudio;
  const N = n => 440 * Math.pow(2, (n - 69) / 12);
  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = state.muted ? 0 : .5; master.connect(ctx.destination);
  }
  function tone(midi, t, dur, type = 'triangle', vol = .25, dest = master) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = N(midi);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05);
  }
  function noise(t, dur, vol = .2, freq = 800) {
    const len = ctx.sampleRate * dur, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  const seq = (notes, step, type, vol, start = 0) => {
    const t0 = ctx.currentTime + start;
    notes.forEach((n, i) => n != null && tone(n, t0 + i * step, step * 1.8, type, vol));
  };
  const api = {
    unlock() { init(); if (ctx.state === 'suspended') ctx.resume(); },
    setMuted(m) {
      if (!ctx) return;
      master.gain.setTargetAtTime(m ? 0 : .5, ctx.currentTime, .05);
      if (bgmAudio) bgmAudio.muted = m;
    },
    click() { if (!ctx) return; seq([84, 91], .05, 'square', .12); },
    welcome() {
      if (!ctx) return;
      seq([72, 76, 79, 84, null, 79, 84, 88], .11, 'square', .15);
      seq([48, null, 55, null, 60, null, 60, 64], .11, 'triangle', .25);
      noise(ctx.currentTime, .4, .15, 3000);
    },
    rumble(dur = 1.1) {
      if (!ctx) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(55, t); o.frequency.linearRampToValueAtTime(110, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.12, t + .2); g.gain.linearRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .1);
      for (let i = 0; i < 6; i++) tone(72 + i * 2, t + i * dur / 6, .08, 'sine', .06);
    },
    ding() { if (!ctx) return; seq([96, 100], .09, 'sine', .25); noise(ctx.currentTime, .25, .1, 5000); },
    flip() { if (!ctx) return; noise(ctx.currentTime, .15, .25, 1500); },
    reveal(r) {
      if (!ctx) return;
      const rank = RARITIES[r].rank;
      if (rank <= 1) seq([79, 84], .08, 'triangle', .2);
      else if (rank === 2) seq([76, 79, 83, 88], .08, 'square', .14);
      else if (r === 'beast') {
        seq([45, 44, 45, 51, 57, 56, 57, 63], .13, 'sawtooth', .12);
        seq([69, 68, 69, 75, 81], .13, 'square', .08, .5);
        noise(ctx.currentTime, 1.2, .25, 200);
      } else {
        seq([72, 76, 79, 84, 88, 91, 96], .07, 'square', .13);
        seq([60, 64, 67, 72], .2, 'triangle', .22, .45);
        noise(ctx.currentTime + .45, .8, .12, 6000);
      }
    },
    bgm(on) {
      if (!ctx) return;
      if (CONFIG.USE_LOCAL_ASSETS) {
        if (!bgmAudio) { bgmAudio = new Audio('assets/bgm.mp3'); bgmAudio.loop = true; bgmAudio.volume = .4; bgmAudio.muted = state.muted; }
        on ? bgmAudio.play().catch(() => {}) : bgmAudio.pause();
        return;
      }
      if (on === bgmOn) return;
      bgmOn = on; clearTimeout(bgmTimer);
      if (!on) return;
      // 동화풍 왈츠 루프
      const mel = [76,79,84, 83,79,76, 74,77,81, 79,77,74, 72,76,79, 81,79,76, 74,79,77, 72,null,null];
      const bass = [48,55,60, 43,50,55, 50,57,62, 43,50,55];
      const step = .22;
      const loop = () => {
        if (!bgmOn) return;
        const t0 = ctx.currentTime + .05;
        mel.forEach((n, i) => n != null && tone(n, t0 + i * step, step * 1.6, 'triangle', .06));
        bass.forEach((n, i) => tone(n, t0 + i * step * 2, step * 1.9, 'sine', .07));
        bgmTimer = setTimeout(loop, mel.length * step * 1000);
      };
      loop();
    },
  };
  return api;
})();

/* =========================================================
   뽑기 로직
   ========================================================= */
const TABLE = [];
Object.entries(RARITIES).forEach(([r, v]) => {
  TABLE.push({ r, type: 'cookie', w: v.cookie });
  TABLE.push({ r, type: 'soul', w: v.soul });
});
const TOTAL_W = TABLE.reduce((s, x) => s + x.w, 0);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function roll(filter) {
  const table = filter ? TABLE.filter(filter) : TABLE;
  const total = table.reduce((s, x) => s + x.w, 0);
  let x = Math.random() * total;
  for (const e of table) { if ((x -= e.w) < 0) return e; }
  return table[table.length - 1];
}
function makeItem(entry) {
  const cookie = pick(BY_RARITY[entry.r]);
  const item = { type: entry.type, r: entry.r, cookie, count: 1, isNew: false, dup: false };
  if (entry.type === 'soul') item.count = randInt(...RARITIES[entry.r].ss);
  return item;
}
function drawMany(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    state.pity++;
    let e;
    if (state.pity >= CONFIG.EPIC_PITY) {
      // 천장: 에픽 이상 쿠키 확정
      e = roll(x => x.type === 'cookie' && RARITIES[x.r].rank >= 2);
    } else {
      e = roll();
    }
    if (e.type === 'cookie' && RARITIES[e.r].rank >= 2) state.pity = 0;
    out.push(makeItem(e));
  }
  // 10회 뽑기: 최소 1개의 쿠키 확정
  if (n >= 10 && !out.some(x => x.type === 'cookie')) {
    const e = roll(x => x.type === 'cookie');
    if (RARITIES[e.r].rank >= 2) state.pity = 0;
    out[n - 1] = makeItem(e);
  }
  // 보유/중복 처리
  out.forEach(it => {
    const id = it.cookie.id;
    if (it.type === 'cookie') {
      if (state.owned[id]) { it.dup = true; state.souls[id] = (state.souls[id] || 0) + DUP_SOULSTONES[it.r]; }
      else { it.isNew = true; state.owned[id] = true; }
    } else {
      state.souls[id] = (state.souls[id] || 0) + it.count;
    }
  });
  return out;
}

      </div>
    </div>
  </div>`;
}

/* =========================================================
   화면 흐름
   ========================================================= */
function confetti(host, n = 40) {
  const colors = ['#ff5a6e', '#ffcf3f', '#6fd13a', '#4fb0ff', '#d45cff', '#fff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = pick(colors);
    c.style.animationDuration = 1.8 + Math.random() * 1.6 + 's';
    c.style.animationDelay = Math.random() * .6 + 's';
    host.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

$('#startBtn').addEventListener('click', async () => {
  Sound.unlock(); Sound.click();
  show('welcome');
  Sound.welcome();
  confetti($('#welcome'), 50);
  await wait(2600);
  show('gacha');
  Sound.bgm(true);
});
$('#homeBtn').addEventListener('click', () => { Sound.click(); Sound.bgm(false); show('title'); });
$('#refillBtn').addEventListener('click', () => {
  Sound.click(); state.crystals += 30000; save(); refreshHud(); toast('💎 크리스탈 30,000개 충전!');
});
$('#soundBtn').addEventListener('click', () => {
  Sound.unlock();
  state.muted = !state.muted; save();
  Sound.setMuted(state.muted);
  $('#soundBtn').textContent = state.muted ? '🔇' : '🔊';
});

let busy = false;
async function doPull(n) {
  if (busy) return;
  const cost = n === 1 ? CONFIG.COST_1 : CONFIG.COST_10;
  if (state.crystals < cost) { toast('크리스탈이 부족해요! + 버튼으로 충전하세요'); return; }
  busy = true;
  Sound.unlock(); Sound.click();
  state.crystals -= cost;
  const results = drawMany(n);
  state.lastResults = results;
  save(); refreshHud();
  await playSequence(results);
  busy = false;
}
$('#pull1').addEventListener('click', () => doPull(1));
$('#pull10').addEventListener('click', () => doPull(10));

/* 오븐 → 카드 연출 */
let skipRequested = false, tapResolve = null;
function waitTap() { return new Promise(r => { tapResolve = r; }); }
$('#reveal').addEventListener('click', e => {
  if (e.target.closest('#skipBtn')) return;
  if (tapResolve) { const r = tapResolve; tapResolve = null; r(); }
});
$('#skipBtn').addEventListener('click', () => {
  skipRequested = true;
  if (tapResolve) { const r = tapResolve; tapResolve = null; r(); }
});

function puffSteam() {
  const wrap = $('#ovenWrap');
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('div');
    s.className = 'steam';
    s.style.left = 205 / 300 * wrap.clientWidth + Math.random() * 10 + 'px';
    s.style.top = 10 + 'px';
    s.style.animationDelay = i * .2 + 's';
    wrap.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
}

async function ovenBake(item) {
  // 오븐 문 창의 빛 색으로 등급 힌트
  const R = RARITIES[item.r];
  const glow = $('#ovenGlow'), win = $('#doorWindowGlow'), door = $('#ovenDoor'), wrap = $('#ovenWrap');
  door.classList.remove('open');
  win.setAttribute('fill', '#ffcf3f'); win.setAttribute('opacity', '.25');
  wrap.classList.add('shake');
  puffSteam();
  Sound.rumble(R.rank >= 3 ? 1.5 : 0.9);
  await wait(R.rank >= 3 ? 700 : 450);
  win.setAttribute('fill', R.hex); win.setAttribute('opacity', '.85');
  await wait(R.rank >= 3 ? 800 : 450);
  wrap.classList.remove('shake');
  Sound.ding();
  glow.setAttribute('fill', R.hex); glow.setAttribute('opacity', '.9');
  door.classList.add('open');
  await wait(350);
}

async function playSequence(results) {
  skipRequested = false;
  const rev = $('#reveal'), holder = $('#revealCardHolder');
  for (let i = 0; i < results.length && !skipRequested; i++) {
    const it = results[i], R = RARITIES[it.r];
    // 1) 오븐에서 굽기
    rev.classList.remove('show');
    await ovenBake(it);
    if (skipRequested) break;
    // 2) 카드 등장 (뒷면)
    rev.classList.add('show');
    rev.style.setProperty('--burst', R.hex);
    $('#burst').style.display = R.rank >= 2 ? 'block' : 'none';
    $('#counter').textContent = `${i + 1} / ${results.length}`;
    $('#tapHint').textContent = '터치해서 카드 뒤집기';
    holder.innerHTML = cardHTML(it, false);
    const card = holder.firstElementChild;
    card.classList.add('pop');
    await waitTap();
    if (skipRequested) break;
    // 3) 카드 뒤집기
    Sound.flip();
    card.classList.add('flipped');
    await wait(250);
    Sound.reveal(it.r);
    if (R.rank >= 3) {
      const fl = $('#flash');
      fl.style.background = it.r === 'beast' ? '#1a0033' : R.hex;
      fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
      confetti(rev, it.r === 'beast' ? 20 : 60);
    }
    $('#tapHint').textContent = i < results.length - 1 ? '터치해서 다음 쿠키' : '터치해서 결과 보기';
    await waitTap();
  }
  tapResolve = null;
  rev.classList.remove('show');
  $('#ovenDoor').classList.remove('open');
  $('#ovenGlow').setAttribute('opacity', '0');
  showResults(results);
}

/* 결과 목록 */
function showResults(results) {
  const grid = $('#grid');
  grid.classList.toggle('single', results.length === 1);
  grid.innerHTML = results.map((it, i) => {
    const R = RARITIES[it.r];
    return `<div class="mini" style="--rc:${R.color};animation-delay:${i * .06}s" data-i="${i}">
      ${it.isNew ? '<span class="mnew">NEW</span>' : ''}
      ${it.type === 'soul' ? `<span class="ms">x${it.count}</span>` : ''}
      ${artFor(it)}
      <span class="mr">${R.label}${it.type === 'soul' ? ' 영혼석' : ''}</span>
      <span class="mn">${it.cookie.name.replace(' 쿠키', '')}</span>
    </div>`;
  }).join('');
  const cookies = results.filter(x => x.type === 'cookie').length;
  const best = results.reduce((a, b) => RARITIES[b.r].rank > RARITIES[a.r].rank ? b : a);
  $('#summary').innerHTML = `쿠키 ${cookies}개 · 영혼석 ${results.length - cookies}개 · 최고 등급 <b style="color:${RARITIES[best.r].hex}">${RARITIES[best.r].label}</b><br>카드를 누르면 한 장씩 크게 볼 수 있어요`;
  show('result');
}
$('#grid').addEventListener('click', e => {
  const m = e.target.closest('.mini'); if (!m) return;
  Sound.click(); openViewer(+m.dataset.i);
});
$('#viewAllBtn').addEventListener('click', () => { Sound.click(); openViewer(0); });
$('#againBtn').addEventListener('click', () => { Sound.click(); show('gacha'); refreshHud(); });

/* 한 장씩 보기 */
let vIndex = 0;
function renderViewer() {
  const list = state.lastResults, it = list[vIndex];
  $('#viewerCard').innerHTML = cardHTML(it, true);
  $('#viewerCard').firstElementChild.classList.add('pop');
  $('#viewerCount').textContent = `${vIndex + 1} / ${list.length}`;
  $('#viewerDesc').textContent = it.cookie.desc;
  $('#prevBtn').disabled = vIndex === 0;
  $('#nextBtn').disabled = vIndex === list.length - 1;
}
function openViewer(i) { vIndex = i; renderViewer(); $('#viewer').classList.add('show'); }
$('#prevBtn').addEventListener('click', () => { if (vIndex > 0) { vIndex--; Sound.flip(); renderViewer(); } });
$('#nextBtn').addEventListener('click', () => { if (vIndex < state.lastResults.length - 1) { vIndex++; Sound.flip(); renderViewer(); } });
$('#viewerClose').addEventListener('click', () => $('#viewer').classList.remove('show'));
// 스와이프 & 키보드
let sx = null;
$('#viewer').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
$('#viewer').addEventListener('touchend', e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (dx > 50) $('#prevBtn').click(); else if (dx < -50) $('#nextBtn').click();
});
document.addEventListener('keydown', e => {
  if ($('#viewer').classList.contains('show')) {
    if (e.key === 'ArrowLeft') $('#prevBtn').click();
    if (e.key === 'ArrowRight') $('#nextBtn').click();
    if (e.key === 'Escape') $('#viewerClose').click();
  } else if ($('#reveal').classList.contains('show') && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault(); $('#reveal').click();
  }
});

/* 확률 정보 / 도감 */
function openInfo(html) { $('#infoPanel').innerHTML = html; $('#infoModal').classList.add('show'); }
$('#infoClose').addEventListener('click', () => $('#infoModal').classList.remove('show'));
$('#rateBtn').addEventListener('click', () => {
  Sound.click();
  const rows = Object.entries(RARITIES).map(([r, v]) =>
    `<tr><td><span class="dot" style="background:${v.hex}"></span>${v.label}</td><td>${v.cookie.toFixed(2)}%</td><td>${v.soul.toFixed(2)}%</td><td>${BY_RARITY[r].length}종</td></tr>`).join('');
  const list = Object.entries(RARITIES).map(([r, v]) =>
    `<div><b style="color:${v.hex === '#fff1a8' ? '#c9a000' : v.hex}">${v.label}</b> ${BY_RARITY[r].map(c => c.name.replace(' 쿠키', '')).join(', ')}</div>`).join('');
  openInfo(`<h3>📜 확률 정보</h3>
    <table><tr><th>등급</th><th>쿠키</th><th>영혼석</th><th>수록</th></tr>${rows}</table>
    <div class="cookies-list">${list}</div>
    <p class="note">· 2025년 1월 공식 확률 개편 후 합산치(레전더리·드래곤·에인션트 약 4.30%, 슈퍼에픽 약 2.40%)를 기준으로 쿠키/영혼석 비율을 나눈 <b>시뮬레이터용 근사값</b>입니다.<br>
    · 10회 뽑기 시 쿠키 1개 이상 확정 · 100회 내 에픽 이상 쿠키 확정(천장)<br>
    · 이미 보유한 쿠키가 나오면 해당 쿠키 영혼석 20개로 전환됩니다.</p>`);
});
$('#bookBtn').addEventListener('click', () => {
  Sound.click();
  const owned = Object.keys(state.owned).length;
  const rows = Object.entries(RARITIES).map(([r, v]) =>
    `<div style="margin-top:6px"><b style="color:${v.hex === '#fff1a8' ? '#c9a000' : v.hex}">${v.label}</b><br>` +
    BY_RARITY[r].map(c => `${state.owned[c.id] ? '🍪' : '⬜'} ${c.name.replace(' 쿠키', '')}${state.souls[c.id] ? ` <small>(💠${state.souls[c.id]})</small>` : ''}`).join(' · ') + '</div>').join('');
  openInfo(`<h3>📖 쿠키 도감 (${owned}/${COOKIES.length})</h3><div class="cookies-list">${rows}</div>
    <p class="note" style="text-align:center"><button class="btn small brown" id="resetBtn">기록 초기화</button></p>`);
  $('#resetBtn').onclick = () => {
    if (!confirm('보유 쿠키·영혼석·크리스탈 기록을 초기화할까요?')) return;
    Object.assign(state, { crystals: CONFIG.START_CRYSTALS, pity: 0, owned: {}, souls: {} });
    save(); refreshHud(); $('#infoModal').classList.remove('show'); toast('기록을 초기화했어요');
  };
});

/* 초기화 */
$('#soundBtn').textContent = state.muted ? '🔇' : '🔊';
refreshHud();
</script>
</body>
</html>
