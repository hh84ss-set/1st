<title>쿠키 오븐 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
/*
  쿠키런: 킹덤 팬메이드 쿠키 뽑기 시뮬레이터
  - 쿠키 이름/등급/뽑기 구조는 공식 게임·위키 정보를 참고
  - 이미지·음악은 쿠키런 킹덤 위키의 공식 이미지 사용 (개인 감상용). img/ 폴더 → 위키 원본 → 직접 그린 SVG 순으로 대체
*/
:root {
  --sky-top: #6ec6ff;
  --sky-bottom: #fff3c4;
  --wood: #8a4b22;
  --wood-dark: #5b2d10;
  --cream: #fff7e0;
  --gold: #ffcf3f;
  --gold-dark: #d9901a;
  --text: #4a2511;
  --btn-green: #6fd13a;
  --btn-green-dark: #3f9a18;
  --btn-orange: #ffae2b;
  --btn-orange-dark: #d8770b;

  --r-common: #b9a58d;
  --r-rare: #4fb0ff;
  --r-epic: #d45cff;
  --r-superepic: #ff4f6d;
  --r-legendary: #3ff0d0;
  --r-dragon: #ff3b1f;
  --r-ancient: #fff1a8;
  --r-beast: #8b2cff;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: #2a1406; }
body {
  font-family: 'Jua', 'Do Hyeon', system-ui, sans-serif;
  color: var(--text);
  background: #2a1406;
  user-select: none;
}
#game {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100%;
  margin: 0 auto;
  overflow: hidden;
  background: linear-gradient(var(--sky-top), var(--sky-bottom));
}
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  opacity: 0; pointer-events: none;
  transition: opacity .5s ease;
}
.screen.active { opacity: 1; pointer-events: auto; }

/* ---------- 공용 버튼 ---------- */
.btn {
  font-family: inherit;
  font-size: 20px;
  color: #fff;
  border: 3px solid #4a2511;
  border-radius: 18px;
  padding: 12px 22px;
  cursor: pointer;
  text-shadow: 0 2px 0 rgba(0,0,0,.35);
  box-shadow: 0 5px 0 #4a2511;
  transition: transform .08s, box-shadow .08s;
  background: linear-gradient(#8ff05a, var(--btn-green) 50%, var(--btn-green-dark));
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #4a2511; }
.btn.orange { background: linear-gradient(#ffd070, var(--btn-orange) 50%, var(--btn-orange-dark)); }
.btn.brown  { background: linear-gradient(#b8764a, var(--wood) 50%, var(--wood-dark)); }
.btn.small  { font-size: 15px; padding: 7px 12px; border-radius: 12px; box-shadow: 0 3px 0 #4a2511; }
.btn:disabled { filter: grayscale(.9) brightness(.8); cursor: not-allowed; }

.icon-btn {
  position: absolute; top: 12px;
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 3px solid #4a2511;
  background: var(--cream);
  font-size: 20px;
  cursor: pointer;
  z-index: 50;
  box-shadow: 0 3px 0 #4a2511;
}

/* ---------- 상단 재화 바 ---------- */
.topbar {
  width: 100%;
  display: flex; justify-content: flex-end; align-items: center; gap: 8px;
  padding: 12px 64px 0 12px;
  z-index: 5;
}
.currency {
  display: flex; align-items: center; gap: 6px;
  background: rgba(40,20,5,.75);
  color: #fff;
  border-radius: 20px;
  padding: 4px 12px 4px 6px;
  font-size: 17px;
  border: 2px solid #ffe7a3;
}
.currency .plus {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--btn-green); border: 2px solid #fff;
  color: #fff; font-size: 14px; line-height: 16px; text-align: center;
  cursor: pointer; margin-left: 4px;
}

/* ---------- 타이틀 화면 ---------- */
#title { justify-content: flex-end; padding-bottom: 34px; background: linear-gradient(#58b8ff 0%, #9fdcff 45%, #ffe9b8 75%); }
#title .sunrays {
  position: absolute; left: 50%; top: 34%; width: 900px; height: 900px; margin: -450px 0 0 -450px;
  background: repeating-conic-gradient(rgba(255,255,255,.28) 0 7deg, transparent 7deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 10%, transparent 60%);
          mask: radial-gradient(circle, #000 10%, transparent 60%);
  animation: spin 40s linear infinite;
}
#title .bg-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#title .cloud { animation: drift 26s linear infinite alternate; }
@keyframes drift { to { transform: translateX(60px); } }
#title .sparkle { position: absolute; color: #fff; font-size: 18px; text-shadow: 0 0 8px #fff7b0; animation: twinkle 2.4s ease-in-out infinite; pointer-events: none; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
.logo {
  position: absolute; top: 3%;
  display: flex; flex-direction: column; align-items: center;
  animation: bob 3.2s ease-in-out infinite;
  z-index: 2;
}
.logo .crown { width: 84px; margin-bottom: 2px; filter: drop-shadow(0 4px 0 #6b3408); }
.logo .l1 {
  font-family: 'Do Hyeon', sans-serif;
  font-size: 15px; color: #fff; letter-spacing: 3px;
  background: #6b3408; border-radius: 10px; padding: 1px 10px; margin-bottom: 4px;
}
.logo .l2 {
  font-size: 64px; line-height: 1;
  color: #ffd23f;
  -webkit-text-stroke: 3px #6b3408;
  paint-order: stroke fill;
  text-shadow: 0 -2px 0 #fff3a0, 0 6px 0 #6b3408, 0 10px 16px rgba(0,0,0,.3);
}
.logo .ribbon {
  position: relative; margin-top: 6px;
  background: linear-gradient(#ff8fbf, #ff5a9a);
  color: #fff; font-size: 20px; letter-spacing: 2px;
  padding: 5px 26px;
  border: 3px solid #6b3408;
  text-shadow: 0 2px 0 #b3265a;
  box-shadow: 0 4px 0 #6b3408;
}
.logo .ribbon::before, .logo .ribbon::after {
  content: ''; position: absolute; top: 8px; width: 22px; height: 100%;
  background: #e0457d; border: 3px solid #6b3408; z-index: -1;
}
.logo .ribbon::before { left: -18px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 40% 50%); }
.logo .ribbon::after { right: -18px; clip-path: polygon(0 0, 100% 0, 60% 50%, 100% 100%, 0 100%); }
@keyframes bob { 50% { transform: translateY(-8px); } }
.lineup {
  position: absolute; bottom: 150px; left: 0; right: 0;
  display: flex; justify-content: center; align-items: flex-end;
  z-index: 2; pointer-events: none;
}
.lineup .ck { width: 76px; margin: 0 -6px; animation: hop 1.6s ease-in-out infinite; filter: drop-shadow(0 6px 4px rgba(60,30,0,.35)); }
.lineup .ck.big { width: 104px; z-index: 2; }
.lineup .ck svg { width: 100%; display: block; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.start-frame {
  z-index: 3;
  padding: 8px; border-radius: 26px;
  background: linear-gradient(#ffe38a, #d9901a);
  border: 3px solid #6b3408;
  box-shadow: 0 6px 0 #6b3408, 0 0 24px rgba(255,220,120,.8);
}
#title .start-btn { font-size: 26px; padding: 14px 34px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); } }
#title .notice { margin-top: 12px; font-size: 12px; color: #6b3408; z-index: 3; text-align: center; padding: 0 20px; background: rgba(255,247,224,.75); border-radius: 10px; }

/* ---------- 공식 이미지 ---------- */
.hero-art { display: none; }
#title.official .hero-art {
  display: block; position: absolute; z-index: 2;
  top: 31%; left: 12px; right: 12px; bottom: 150px;
  max-width: 100%;
  border: 5px solid #6b3408; border-radius: 22px; overflow: hidden;
  box-shadow: 0 0 0 4px #ffd23f, 0 8px 0 4px #6b3408, 0 16px 30px rgba(0,0,0,.35);
  animation: heroIn .8s cubic-bezier(.3,1.4,.5,1) both;
}
.hero-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
@keyframes heroIn { from { transform: scale(.85) rotate(-2deg); opacity: 0; } }
#title.official .bg-svg g[transform^="translate(240"] { opacity: .35; }
#title.official .lineup { display: none; }
.lineup .ck img { width: 100%; height: 150px; object-fit: contain; object-position: bottom; display: block; }
.lineup .ck.big img { height: 190px; }
#title.official .lineup .ck { width: 90px; margin: 0 -12px; }
#title.official .lineup .ck.big { width: 120px; }
.gnome-official img { width: 170px; transform: scale(0); z-index: 2; position: relative; }
#welcome.active .gnome-official img { animation: popIn .6s .2s cubic-bezier(.3,1.6,.5,1) forwards; }
#gachaBanner { background-image: linear-gradient(rgba(40,15,0,0) 35%, rgba(40,15,0,.88) 78%), var(--hdr, linear-gradient(135deg, #ffe38a, #ffb347)); background-size: cover; background-position: center 30%; min-height: 104px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 12px; }
#gachaBanner h2 { color: #ffd23f; font-size: 22px; line-height: 1.1; text-shadow: 0 2px 0 #2a1406; }
#gachaBanner p { color: #fff3c4; font-size: 13px; }
.card .face.back:has(.silhouette) { background: radial-gradient(circle at 50% 45%, #5a3a8a 0%, #1a0f2e 75%); }
.card .back .silhouette { width: 70%; max-height: 80%; object-fit: contain; filter: drop-shadow(0 0 16px rgba(255,255,255,.6)); animation: glowPulse 1.2s ease-in-out infinite; }
@keyframes glowPulse { 50% { transform: scale(1.05); } }
.art-img { height: 92%; max-width: 94%; object-fit: contain; filter: drop-shadow(0 4px 4px rgba(60,30,0,.3)); }
.art-img.soul { height: 60%; }
.mini .art-img { width: 94%; height: auto; flex: 1; min-height: 0; }
.mini .art-img.soul { width: 70%; }
.rarity-badge.has-img { background: none !important; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; margin-top: -22px; }
.rarity-badge.has-img .badge-img { height: 30px; width: auto; filter: drop-shadow(0 2px 0 #4a2511); }
.rarity-badge.has-img span { font-size: 13px; color: #4a2511; text-shadow: none; }

/* ---------- 환영 전환 ---------- */
#welcome { justify-content: center; background: radial-gradient(circle, #fff6c9 0%, #ffcf5a 55%, #e0791c 100%); }
#welcome .rays {
  position: absolute; width: 200%; height: 200%; left: -50%; top: -50%;
  background: repeating-conic-gradient(rgba(255,255,255,.35) 0 10deg, transparent 10deg 20deg);
  animation: spin 12s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#welcome .gnome { width: 170px; z-index: 2; transform: scale(0); }
#welcome.active .gnome { animation: popIn .6s .2s cubic-bezier(.3,1.6,.5,1) forwards; }
.speech {
  z-index: 2;
  margin-top: 12px;
  background: #fff; border: 4px solid #6b3408; border-radius: 22px;
  padding: 16px 24px; font-size: 26px; text-align: center;
  position: relative; transform: scale(0);
}
.speech::before {
  content: ''; position: absolute; top: -18px; left: 50%; margin-left: -12px;
  border: 12px solid transparent; border-bottom: 14px solid #6b3408; border-top: 0;
}
#welcome.active .speech { animation: popIn .5s .7s cubic-bezier(.3,1.6,.5,1) forwards; }
.speech b { color: #e0561c; }
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
.confetti { position: absolute; top: -20px; width: 10px; height: 16px; z-index: 3; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------- 뽑기 화면 ---------- */
#gacha { background: linear-gradient(#3b1d0c, #6b3a1a 45%, #9b5a2a); }
#gacha .wall {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 38px, rgba(0,0,0,.18) 38px 41px),
    repeating-linear-gradient(90deg, transparent 0 78px, rgba(0,0,0,.12) 78px 81px);
  opacity: .6;
}
.banner {
  margin-top: 8px; z-index: 2;
  width: 92%;
  background: linear-gradient(135deg, #ffe38a, #ffb347);
  border: 4px solid #6b3408; border-radius: 18px;
  padding: 8px 12px; text-align: center;
  box-shadow: 0 5px 0 #4a2511;
}
.banner h2 { font-size: 24px; color: #6b3408; }
.banner p { font-size: 14px; color: #8a4b22; }
.oven-wrap { position: relative; z-index: 2; margin-top: 10px; width: 300px; height: 320px; }
.oven-wrap svg { width: 100%; height: 100%; overflow: visible; }
.oven-wrap.shake { animation: shake .12s linear infinite; }
@keyframes shake {
  0% { transform: translate(0,0) rotate(0); }
  25% { transform: translate(-3px,1px) rotate(-1deg); }
  50% { transform: translate(2px,-2px) rotate(1deg); }
  75% { transform: translate(-1px,2px) rotate(0); }
}
#ovenGlow { transition: fill .3s, opacity .3s; }
#ovenDoor { transform-origin: 150px 256px; transition: transform .45s cubic-bezier(.4,1.6,.6,1); }
#ovenDoor.open { transform: scaleY(-0.25) translateY(40px); }
.steam { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.7); filter: blur(4px); animation: steam 1.5s ease-out forwards; z-index: 3; }
@keyframes steam { to { transform: translateY(-120px) scale(2.5); opacity: 0; } }

.pull-row { z-index: 2; display: flex; gap: 14px; margin-top: 6px; }
.pull-btn { display: flex; flex-direction: column; align-items: center; min-width: 140px; }
.pull-btn .cost { font-size: 14px; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.info-row { z-index: 2; margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; padding: 0 12px; gap: 10px; align-items: center; color: #ffe7a3; font-size: 15px; }
.pity { background: rgba(0,0,0,.35); border-radius: 12px; padding: 4px 10px; }
.mode-chip { font-family: inherit; font-size: 14px; color: #ffe7a3; background: rgba(0,0,0,.35); border: 2px dashed #ffe7a3; border-radius: 12px; padding: 3px 12px; cursor: pointer; }
.mode-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
.mode-btn { font-family: inherit; font-size: 16px; padding: 6px 14px; border-radius: 12px; border: 3px solid #4a2511; background: #fff; color: #4a2511; cursor: pointer; }
.mode-btn.on { background: var(--gold); box-shadow: 0 3px 0 #4a2511; }

/* ---------- 연출 오버레이 ---------- */
#reveal {
  position: absolute; inset: 0; z-index: 55;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(20,8,2,.8);
}
#reveal.show { display: flex; }
#reveal .flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
#reveal .flash.go { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
#reveal .burst {
  position: absolute; width: 640px; height: 640px; left: 50%; top: 50%; margin: -340px 0 0 -320px;
  background: repeating-conic-gradient(var(--burst, #fff) 0 8deg, transparent 8deg 20deg);
  opacity: .35; border-radius: 50%;
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%);
          mask: radial-gradient(circle, #000 20%, transparent 68%);
  animation: spin 10s linear infinite;
}
.counter { position: absolute; top: 18px; left: 18px; color: #fff; font-size: 20px; z-index: 3; }
.skip-btn { position: absolute; top: 14px; right: 14px; z-index: 3; }
.tap-hint { position: absolute; bottom: 28px; color: #fff; font-size: 18px; opacity: .8; animation: blink 1.2s infinite; z-index: 3; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- 카드 ---------- */
.card {
  --rc: var(--r-common);
  position: relative;
  width: 240px; height: 340px;
  perspective: 1000px;
  z-index: 3;
}
.card .inner {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.3,1.3,.5,1);
}
.card.flipped .inner { transform: rotateY(180deg); }
.card .face {
  position: absolute; inset: 0; border-radius: 20px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 5px solid #4a2511;
  overflow: hidden;
}
.card .back {
  background:
    radial-gradient(circle at 50% 45%, rgba(255,255,255,.4), transparent 50%),
    repeating-linear-gradient(45deg, #b7682b 0 14px, #a45a22 14px 28px);
  display: flex; align-items: center; justify-content: center;
}
.card .back .emblem {
  width: 110px; height: 110px; border-radius: 50%;
  background: #ffe7a3; border: 5px solid #6b3408;
  display: flex; align-items: center; justify-content: center; font-size: 56px;
}
.card .front {
  transform: rotateY(180deg);
  background: linear-gradient(170deg, #fffaf0 0%, #ffe9c2 100%);
  display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 0 0 4px var(--rc), 0 0 40px var(--rc);
}
.card .front .art {
  width: 100%; height: 62%;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--rc) 55%, #fff) 0%, color-mix(in srgb, var(--rc) 25%, #fff5e0) 70%);
  border-bottom: 4px solid #4a2511;
  position: relative;
}
.card .front .art svg, .card .front .art img { height: 88%; max-width: 90%; object-fit: contain; }
.rarity-badge {
  margin-top: -16px; z-index: 2;
  padding: 3px 14px; border-radius: 14px;
  border: 3px solid #4a2511;
  font-size: 16px; color: #fff;
  text-shadow: 0 1px 0 rgba(0,0,0,.5);
  background: var(--rc);
}
.rarity-legendary .rarity-badge { background: linear-gradient(90deg,#ff7b7b,#ffd66b,#7bffb0,#6bc8ff,#c77bff); }
.rarity-ancient .rarity-badge { background: linear-gradient(90deg,#fff6c9,#ffd76b,#fff6c9); color: #7a4b00; text-shadow: none; }
.rarity-beast .rarity-badge { background: linear-gradient(90deg,#3a0066,#8b2cff,#ff2c6a); }
.rarity-dragon .rarity-badge { background: linear-gradient(90deg,#ff3b1f,#ffae00); }
.card .name { margin-top: 8px; font-size: 22px; text-align: center; padding: 0 8px; line-height: 1.15; }
.card .kind { margin-top: 4px; font-size: 15px; color: #8a4b22; }
.card .tag {
  position: absolute; top: 10px; left: 10px;
  background: #ff3d3d; color: #fff; font-size: 14px;
  border: 2px solid #fff; border-radius: 10px; padding: 1px 8px;
  transform: rotate(-10deg);
  z-index: 3;
}
.card .tag.dup { background: #7d6b5a; }
.card .ss-count {
  position: absolute; bottom: 8px; right: 10px;
  font-size: 22px; color: #fff; -webkit-text-stroke: 1px #4a2511;
  text-shadow: 0 2px 0 #4a2511;
}
.card.pop { animation: cardPop .55s cubic-bezier(.3,1.5,.5,1); }
@keyframes cardPop { from { transform: translateY(120px) scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
.card.hi .front::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.75) 45%, transparent 60%);
  background-size: 250% 100%;
  animation: shine 2.2s ease-in-out infinite;
}
@keyframes shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }

/* ---------- 결과 화면 ---------- */
#result { background: linear-gradient(#4a2511, #7a4320); }
#result h2 { color: var(--gold); font-size: 30px; margin-top: 18px; text-shadow: 0 3px 0 #2a1406, 0 0 14px rgba(255,207,63,.5); }
#result .summary { color: #ffe7a3; font-size: 15px; margin: 4px 0 8px; text-align: center; padding: 0 12px; }
.grid {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px;
  width: 100%; padding: 8px 12px; overflow-y: auto; flex: 1;
  align-content: start;
}
.grid.single { grid-template-columns: 1fr; justify-items: center; }
.mini {
  --rc: var(--r-common);
  position: relative;
  aspect-ratio: 3/4.2;
  border-radius: 10px; border: 3px solid #4a2511;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 50%, #fff) 0%, color-mix(in srgb, var(--rc) 20%, #fff3dc) 75%);
  box-shadow: 0 0 0 2px var(--rc);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 4px 2px;
  cursor: pointer;
  animation: cardPop .4s both cubic-bezier(.3,1.5,.5,1);
  transition: transform .1s;
}
.mini:hover { transform: translateY(-3px); }
.grid.single .mini { width: 150px; }
.mini svg, .mini img { width: 90%; flex: 1; min-height: 0; }
.mini .mr { font-size: 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; color: #fff; background: var(--rc); border-radius: 6px; padding: 0 4px; border: 1px solid #4a2511; white-space: nowrap; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.mini .mn { font-size: 11px; text-align: center; line-height: 1.05; margin-top: 2px; word-break: keep-all; }
.mini .ms { position: absolute; top: 2px; right: 4px; font-size: 13px; color: #fff; -webkit-text-stroke: .6px #4a2511; }
.mini .mnew { position: absolute; top: -4px; left: -4px; background: #ff3d3d; color: #fff; font-size: 10px; border-radius: 6px; padding: 0 4px; border: 1px solid #fff; }

/* =========================================================
   사운드 (Web Audio 합성 — 외부 음원 없이 동작)
   ========================================================= */
const Sound = (() => {
  let ctx, master, bgmTimer, bgmOn = false, bgmAudio;
  const N = n => 440 * Math.pow(2, (n - 69) / 12);
  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = state.muted ? 0 : .5; master.connect(ctx.destination);
  }
  function tone(midi, t, dur, type = 'triangle', vol = .25, dest = master) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = N(midi);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05);
  }
  function noise(t, dur, vol = .2, freq = 800) {
    const len = ctx.sampleRate * dur, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  const seq = (notes, step, type, vol, start = 0) => {
    const t0 = ctx.currentTime + start;
    notes.forEach((n, i) => n != null && tone(n, t0 + i * step, step * 1.8, type, vol));
  };
  const api = {
    unlock() { init(); if (ctx.state === 'suspended') ctx.resume(); },
    setMuted(m) {
      if (!ctx) return;
      master.gain.setTargetAtTime(m ? 0 : .5, ctx.currentTime, .05);
      if (bgmAudio) bgmAudio.muted = m;
    },
    click() { if (!ctx) return; seq([84, 91], .05, 'square', .12); },
    welcome() {
      if (!ctx) return;
      seq([72, 76, 79, 84, null, 79, 84, 88], .11, 'square', .15);
      seq([48, null, 55, null, 60, null, 60, 64], .11, 'triangle', .25);
      noise(ctx.currentTime, .4, .15, 3000);
    },
    rumble(dur = 1.1) {
      if (!ctx) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(55, t); o.frequency.linearRampToValueAtTime(110, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.12, t + .2); g.gain.linearRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .1);
      for (let i = 0; i < 6; i++) tone(72 + i * 2, t + i * dur / 6, .08, 'sine', .06);
    },
    ding() { if (!ctx) return; seq([96, 100], .09, 'sine', .25); noise(ctx.currentTime, .25, .1, 5000); },
    flip() { if (!ctx) return; noise(ctx.currentTime, .15, .25, 1500); },
    reveal(r) {
      if (!ctx) return;
      const rank = RARITIES[r].rank;
      if (rank <= 1) seq([79, 84], .08, 'triangle', .2);
      else if (rank === 2) seq([76, 79, 83, 88], .08, 'square', .14);
      else if (r === 'beast') {
        seq([45, 44, 45, 51, 57, 56, 57, 63], .13, 'sawtooth', .12);
        seq([69, 68, 69, 75, 81], .13, 'square', .08, .5);
        noise(ctx.currentTime, 1.2, .25, 200);
      } else {
        seq([72, 76, 79, 84, 88, 91, 96], .07, 'square', .13);
        seq([60, 64, 67, 72], .2, 'triangle', .22, .45);
        noise(ctx.currentTime + .45, .8, .12, 6000);
      }
    },
    bgm(on) {
      if (!ctx) return;
      if (CONFIG.USE_OFFICIAL_ART && !api.synthOnly) {
        const key = TRACKS[state.track].key;
        if (bgmAudio && bgmAudio.dataset.key !== key) { bgmAudio.pause(); bgmAudio = null; }
        if (!bgmAudio) {
          bgmAudio = assetAudio(key);
          bgmAudio.dataset.key = key;
          bgmAudio.loop = true; bgmAudio.volume = .4; bgmAudio.muted = state.muted;
        }
        if (!on) { bgmAudio.pause(); return; }
        // 음원을 못 불러오면 합성 BGM으로 대체
        bgmAudio.play().catch(() => { api.synthOnly = true; api.bgm(true); });
        return;
      }
      if (on === bgmOn) return;
      bgmOn = on; clearTimeout(bgmTimer);
      if (!on) return;
      // 밝은 C장조 멜로디 (공식 음원을 못 쓸 때만)
      const mel = [72,76,79,76, 77,81,79,null, 76,79,84,79, 77,76,74,null, 72,76,79,76, 77,81,84,81, 79,77,76,74, 72,null,null,null];
      const bass = [48,55, 53,60, 48,55, 55,50, 48,55, 53,60, 55,50, 48,48];
      const step = .2;
      const loop = () => {
        if (!bgmOn) return;
        const t0 = ctx.currentTime + .05;
        mel.forEach((n, i) => n != null && tone(n, t0 + i * step, step * 1.4, 'sine', .07));
        bass.forEach((n, i) => tone(n, t0 + i * step * 2, step * 1.2, 'triangle', .06));
        bgmTimer = setTimeout(loop, mel.length * step * 1000);
      };
      loop();
    },
  };
  return api;
})();

/* ---------- 공식 이미지 (img/ → 위키 원본 → SVG) ---------- */
function assetImg(key, alt, cls = '', fb = '') {
  const a = ASSETS[key];
  if (!CONFIG.USE_OFFICIAL_ART || !a) return fb;
  return `<img class="${cls}" src="${a.local}" data-remote="${a.remote}" data-fb="${fb ? 'svg' : ''}" data-key="${key}" alt="${alt}" loading="lazy" draggable="false" onerror="imgFail(this)">`;
}
function imgFail(el) {
  if (el.dataset.remote && el.src !== el.dataset.remote) { el.src = el.dataset.remote; return; }
  const key = el.dataset.key || '';
  const id = key.replace(/^(cookie|soul)_/, '');
  const c = COOKIES.find(x => x.id === id);
  if (c && key.startsWith('cookie_')) el.outerHTML = cookieSVG(c);
  else if (c && key.startsWith('soul_')) el.outerHTML = soulstoneSVG(c);
  else el.hidden = true;
}
function assetAudio(key) {
  const a = ASSETS[key], au = new Audio(a.local);
  au.addEventListener('error', () => { if (au.src !== a.remote) { au.src = a.remote; au.play().catch(() => {}); } }, { once: true });
  return au;
}
function artFor(item) {
  const c = item.cookie;
  if (item.type === 'cookie') return assetImg('cookie_' + c.id, c.name, 'art-img', cookieSVG(c)) || cookieSVG(c);
  return assetImg('soul_' + c.id, c.name + ' 영혼석', 'art-img soul', soulstoneSVG(c)) || soulstoneSVG(c);
}
function badgeFor(r) {
  const R = RARITIES[r];
  const img = assetImg('badge_' + r, R.label, 'badge-img');
  return img ? `<div class="rarity-badge has-img">${img}<span>${R.label}</span></div>` : `<div class="rarity-badge">${R.label}</div>`;
}
function silhouetteFor(r) {
  // 커먼/레어 실루엣은 위키에 없어 에픽 실루엣에 색 필터를 입혀 사용
  const key = ASSETS['reveal_' + r] ? 'reveal_' + r : 'reveal_epic';
  const tint = r === 'common' ? 'grayscale(1) sepia(.6) brightness(1.05)' : r === 'rare' ? 'hue-rotate(-80deg) saturate(1.3)' : 'none';
  return assetImg(key, '', 'silhouette" style="filter:' + tint, '') || '<div class="emblem">🍪</div>';
}

/* =========================================================
   뽑기 로직
   ========================================================= */
function buildTable() {
  const off = state.mode === 'official';
  const t = [];
  Object.entries(RARITIES).forEach(([r, v]) => {
    t.push({ r, type: 'cookie', w: off ? v.ocookie : v.cookie });
    t.push({ r, type: 'soul', w: off ? v.osoul : v.soul });
  });
  return t;
}
const pct = (e, table) => e.w / table.reduce((s, x) => s + x.w, 0) * 100;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function roll(filter) {
  const all = buildTable();
  const table = filter ? all.filter(filter) : all;
  const total = table.reduce((s, x) => s + x.w, 0);
  let x = Math.random() * total;
  for (const e of table) { if ((x -= e.w) < 0) return e; }
  return table[table.length - 1];
}
function makeItem(entry) {
  const cookie = pick(BY_RARITY[entry.r]);
  const item = { type: entry.type, r: entry.r, cookie, count: 1, isNew: false, dup: false };
  if (entry.type === 'soul') item.count = randInt(...RARITIES[entry.r].ss);
  return item;
}
function drawMany(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    state.pity++;
    let e;
    if (state.pity >= CONFIG.EPIC_PITY) {
      // 천장: 에픽 이상 쿠키 확정
      e = roll(x => x.type === 'cookie' && RARITIES[x.r].rank >= 2);
    } else {
      e = roll();
    }
    if (e.type === 'cookie' && RARITIES[e.r].rank >= 2) state.pity = 0;
    out.push(makeItem(e));
  }
  // 10회 뽑기: 최소 1개의 쿠키 확정
  if (n >= 10 && !out.some(x => x.type === 'cookie')) {
    const e = roll(x => x.type === 'cookie');
    if (RARITIES[e.r].rank >= 2) state.pity = 0;
    out[n - 1] = makeItem(e);
  }
  // 보유/중복 처리
  out.forEach(it => {
    const id = it.cookie.id;
    if (it.type === 'cookie') {
      if (state.owned[id]) { it.dup = true; state.souls[id] = (state.souls[id] || 0) + DUP_SOULSTONES[it.r]; }
      else { it.isNew = true; state.owned[id] = true; }
    } else {
      state.souls[id] = (state.souls[id] || 0) + it.count;
    }
  });
  return out;
}

function confetti(host, n = 40) {

  for (let i = 0; i < n; i++) {

let busy = false;
async function doPull(n) {
  if (busy) return;
  const cost = n === 1 ? CONFIG.COST_1 : CONFIG.COST_10;
  if (state.crystals < cost) { toast('크리스탈이 부족해요! + 버튼으로 충전하세요'); return; }
  busy = true;
  Sound.unlock(); Sound.click();
  state.crystals -= cost;
  const results = drawMany(n);
  state.lastResults = results;
  save(); refreshHud();
  await playSequence(results);
  busy = false;
}

function puffSteam() {
  const wrap = $('#ovenWrap');
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('div');
    s.className = 'steam';
    s.style.left = 205 / 300 * wrap.clientWidth + Math.random() * 10 + 'px';
    s.style.top = 10 + 'px';
    s.style.animationDelay = i * .2 + 's';
    wrap.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
}

async function ovenBake(item) {
  // 오븐 문 창의 빛 색으로 등급 힌트
  const R = RARITIES[item.r];
  const glow = $('#ovenGlow'), win = $('#doorWindowGlow'), door = $('#ovenDoor'), wrap = $('#ovenWrap');
  door.classList.remove('open');
  win.setAttribute('fill', '#ffcf3f'); win.setAttribute('opacity', '.25');
  wrap.classList.add('shake');
  puffSteam();
  Sound.rumble(R.rank >= 3 ? 1.5 : 0.9);
  await wait(R.rank >= 3 ? 700 : 450);
  win.setAttribute('fill', R.hex); win.setAttribute('opacity', '.85');
  await wait(R.rank >= 3 ? 800 : 450);
  wrap.classList.remove('shake');
  Sound.ding();
  glow.setAttribute('fill', R.hex); glow.setAttribute('opacity', '.9');
  door.classList.add('open');
  await wait(350);
}

async function playSequence(results) {
  skipRequested = false;
  const rev = $('#reveal'), holder = $('#revealCardHolder');
  for (let i = 0; i < results.length && !skipRequested; i++) {
    const it = results[i], R = RARITIES[it.r];
    // 1) 오븐에서 굽기
    rev.classList.remove('show');
    await ovenBake(it);
    if (skipRequested) break;
    // 2) 카드 등장 (뒷면)
    rev.classList.add('show');
    rev.style.setProperty('--burst', R.hex);
    $('#burst').style.display = R.rank >= 2 ? 'block' : 'none';
    $('#counter').textContent = `${i + 1} / ${results.length}`;
    $('#tapHint').textContent = '터치해서 카드 뒤집기';
    holder.innerHTML = cardHTML(it, false);
    const card = holder.firstElementChild;
    card.classList.add('pop');
    await waitTap();
    if (skipRequested) break;
    // 3) 카드 뒤집기
    Sound.flip();
    card.classList.add('flipped');
    await wait(250);
    Sound.reveal(it.r);
    if (R.rank >= 3) {
      const fl = $('#flash');
      fl.style.background = it.r === 'beast' ? '#1a0033' : R.hex;
      fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
      confetti(rev, it.r === 'beast' ? 20 : 60);
    }
    $('#tapHint').textContent = i < results.length - 1 ? '터치해서 다음 쿠키' : '터치해서 결과 보기';
    await waitTap();
  }
  tapResolve = null;
  rev.classList.remove('show');
  $('#ovenDoor').classList.remove('open');
  $('#ovenGlow').setAttribute('opacity', '0');
  showResults(results);
}

    `<div style="margin-top:6px"><b style="color:${v.hex === '#fff1a8' ? '#c9a000' : v.hex}">${v.label}</b><br>` +
    BY_RARITY[r].map(c => `${state.owned[c.id] ? '🍪' : '⬜'} ${c.name.replace(' 쿠키', '')}${state.souls[c.id] ? ` <small>(💠${state.souls[c.id]})</small>` : ''}`).join(' · ') + '</div>').join('');
  openInfo(`<h3>📖 쿠키 도감 (${owned}/${COOKIES.length})</h3><div class="cookies-list">${rows}</div>
    <p class="note" style="text-align:center"><button class="btn small brown" id="resetBtn">기록 초기화</button></p>`);
  $('#resetBtn').onclick = e => {
    // 두 번 눌러 확인 (임베드 환경에서 confirm() 이 막혀 있음)
    if (!e.target.dataset.armed) { e.target.dataset.armed = '1'; e.target.textContent = '한 번 더 누르면 초기화'; return; }
    Object.assign(state, { crystals: CONFIG.START_CRYSTALS, pity: 0, owned: {}, souls: {} });
    save(); refreshHud(); $('#infoModal').classList.remove('show'); toast('기록을 초기화했어요');
  };
});

/* 초기화 */
(function buildTitle() {
  const ids = ['gingerbrave', 'purevanilla', 'shadowmilk', 'hollyberry', 'strawberry'];
  $('#lineup').innerHTML = ids.map((id, i) => {
    const c = COOKIES.find(x => x.id === id);
    return `<div class="ck ${id === 'purevanilla' ? 'big' : ''}" style="animation-delay:${i * .18}s">${assetImg('cookie_' + id, c.name, '', cookieSVG(c))}</div>`;
  }).join('');
  const hero = assetImg('gacha_bg', '쿠키 뽑기 오븐에서 쏟아져 나오는 쿠키들');
  if (hero) { $('#heroArt').innerHTML = hero; $('#title').classList.add('official'); }
  const gnome = assetImg('gnome', '설탕노움');
  if (gnome) { $('#gnomeOfficial').innerHTML = gnome; $('#gnomeSvg').setAttribute('hidden', ''); }
  const header = ASSETS.gacha_header && CONFIG.USE_OFFICIAL_ART;
  if (header) $('#gachaBanner').style.setProperty('--hdr', `url("${ASSETS.gacha_header.local}"), url("${ASSETS.gacha_header.remote}")`);
  const t = $('#title');
  [[12, 22], [82, 18], [20, 46], [88, 44], [50, 36], [70, 60], [10, 62]].forEach(([x, y], i) => {
    const sp = document.createElement('div');
    sp.className = 'sparkle'; sp.textContent = '✦';
    sp.style.left = x + '%'; sp.style.top = y + '%'; sp.style.animationDelay = i * .35 + 's';
    t.appendChild(sp);
  });
})();
$('#soundBtn').textContent = state.muted ? '🔇' : '🔊';
refreshHud();
</script>
