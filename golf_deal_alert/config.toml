# 골프공 핫딜 알리미 설정

[filter]
# 더즌(12구)당 가격 상한
max_price_per_dozen = 28000
# 이 가격까지는 '아깝게 탈락'으로 참고 표시
near_max_price_per_dozen = 35000
# 이보다 싸면 '1슬리브 옵션가'가 대표가로 잡혔거나 로스트볼일 가능성이 높아 제외
min_price_per_dozen = 10000
# 허용 피스 수 (TaylorMade TP5/TP5x 는 5피스라 기본 제외 — 포함하려면 5 추가)
allowed_pieces = [3, 4]
# 로스트볼·중고 제외 키워드 (공백 무시, 대소문자 무시)
exclude_keywords = [
  "로스트", "lost", "중고", "리퍼", "재생", "리피니시", "refinish", "recycled",
  "A급", "B급", "S급", "특A", "AAA", "연습볼", "레인지볼", "레이크볼", "반품", "스크래치",
  "1회사용", "사용감", "used", "refurbished", "practice", "lakeball", "secondhand",
]
# 공이 아닌 액세서리 제외 ('볼마커 증정' 같은 사은품 문구에 걸리지 않도록 좁게 유지)
accessory_keywords = ["볼집게", "리트리버", "볼라이너", "거리측정기"]

[ppomppu]
enabled = true
# 뽐뿌게시판(국내) RSS. RSS 는 최근 글만 담기므로 매시간 백그라운드로 모아 둔다.
feeds = [
  "https://www.ppomppu.co.kr/rss.php?id=ppomppu",
]

[dealbada]
enabled = true
# 그누보드 bo_table 값 (골프포럼 = forum_golf). 목록 주소 …/bbs/board.php?bo_table=XXX 의 XXX.
# RSS 가 있으면 RSS, 없으면 목록 페이지를 읽는다.
boards = ["forum_golf", "deal_domestic"]

[aliexpress]
enabled = true
ship_to_country = "KR"
# 영문 검색어가 결과가 더 많다. 상품명은 한국어(KO)로 받아 모델을 판별한다.
queries = [
  "Titleist Pro V1 golf ball", "Titleist Pro V1x golf ball", "Callaway Chrome Soft golf ball",
  "Callaway Chrome Tour golf ball", "TaylorMade Tour Response golf ball",
  "Bridgestone Tour B golf ball", "Srixon Z-Star golf ball", "Srixon Q-Star Tour golf ball",
  "urethane golf ball 3 piece", "urethane golf ball 4 piece",
]

[naver]
# 네이버 쇼핑 검색 API 는 2026-07-31 종료되어 신규 발급 불가 (대체 API 없음).
# 기존에 발급받은 키가 있을 때만 true 로 켜세요.
enabled = false
display = 100
queries = [
  "프로V1 골프공", "프로V1x 골프공", "타이틀리스트 AVX 골프공", "투어스피드 골프공",
  "크롬소프트 골프공", "크롬투어 골프공", "투어리스폰스 골프공",
  "투어B X 골프공", "투어B XS 골프공", "투어B RX 골프공", "투어B RXS 골프공",
  "Z스타 골프공", "Z스타 XV 골프공", "큐스타투어 골프공",
  "RB투어 골프공", "스태프모델 골프공", "커클랜드 골프공", "볼빅 S3", "볼빅 S4",
  "우레탄 3피스 골프공", "우레탄 4피스 골프공",
]
# 네이버플러스 멤버십 보유 여부
plus_membership = true
# 스마트스토어 N페이 결제 시 멤버십 추가 적립률 '가정값'.
# 실제 요율은 네이버 멤버십 화면에서 확인한 값으로 바꿔 주세요.
plus_extra_rate = 0.04

[my_benefits]
# 내가 가진 상시 혜택. N페이(스마트스토어) 딜의 조건란에 함께 표시된다.
# 예: "네이버현대카드 N페이 결제 시 추가 적립(전월실적 조건)"
naverpay = []

[search]
keep_hours = 72       # 백그라운드 수집분을 검색 결과에 포함하는 기간
dealbada_pages = 3    # 버튼 검색 시 딜바다 게시판을 몇 쪽까지 읽을지
